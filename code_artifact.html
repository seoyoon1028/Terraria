<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테라리아 장비 스탯 계산기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for pixel styling fallback and modern clean text -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 41, 59, 0.8) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.9) 0px, transparent 50%);
        }
        
        .pixel-font {
            font-family: 'Press Start 2P', cursive;
        }

        /* Terraria Style Border & Glow Effects */
        .terraria-card {
            background: rgba(30, 41, 59, 0.85);
            border: 2px solid #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2), inset 0 0 10px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .terraria-input-group {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #475569;
            transition: all 0.2s ease-in-out;
        }

        .terraria-input-group:hover, .terraria-input-group:focus-within {
            border-color: #f59e0b;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.3);
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1.25em;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="w-full max-w-2xl mx-auto text-center my-4 md:my-6">
        <div class="inline-block p-2 px-4 rounded-xl bg-amber-500/10 border border-amber-500/30 mb-2">
            <span class="text-xs md:text-sm font-semibold text-amber-400 tracking-widest uppercase">Terraria Equipment Calculator</span>
        </div>
        <h1 class="text-2xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-orange-400 to-red-500 drop-shadow-sm">
            테라리아 장비 스탯 계산기
        </h1>
        <p class="text-xs md:text-sm text-slate-400 mt-2">부위별 장비를 선택하여 총 방어력과 공격 옵션을 확인하세요.</p>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-xl mx-auto flex-1 flex flex-col justify-center gap-6">

        <!-- Selector Card -->
        <div class="terraria-card rounded-2xl p-5 md:p-6 shadow-2xl">
            <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2 border-b border-slate-700/60 pb-2">
                <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                장비 선택
            </h2>

            <div class="space-y-4">
                <!-- Helmet Selector -->
                <div class="terraria-input-group rounded-xl p-3 flex flex-col gap-1">
                    <label for="helmet-select" class="text-xs font-bold text-amber-400 uppercase tracking-wider flex justify-between">
                        <span>[ 투구 ]</span>
                        <span id="helmet-class-tag" class="text-slate-400 font-normal text-[11px]">선택 없음</span>
                    </label>
                    <select id="helmet-select" class="w-full bg-transparent text-slate-100 py-1.5 pr-8 focus:outline-none font-medium cursor-pointer">
                        <!-- JS populated -->
                    </select>
                </div>

                <!-- Breastplate Selector -->
                <div class="terraria-input-group rounded-xl p-3 flex flex-col gap-1">
                    <label for="chest-select" class="text-xs font-bold text-cyan-400 uppercase tracking-wider flex justify-between">
                        <span>[ 갑옷 ]</span>
                        <span id="chest-class-tag" class="text-slate-400 font-normal text-[11px]">선택 없음</span>
                    </label>
                    <select id="chest-select" class="w-full bg-transparent text-slate-100 py-1.5 pr-8 focus:outline-none font-medium cursor-pointer">
                        <!-- JS populated -->
                    </select>
                </div>

                <!-- Leggings Selector -->
                <div class="terraria-input-group rounded-xl p-3 flex flex-col gap-1">
                    <label for="legs-select" class="text-xs font-bold text-emerald-400 uppercase tracking-wider flex justify-between">
                        <span>[ 하의 ]</span>
                        <span id="legs-class-tag" class="text-slate-400 font-normal text-[11px]">선택 없음</span>
                    </label>
                    <select id="legs-select" class="w-full bg-transparent text-slate-100 py-1.5 pr-8 focus:outline-none font-medium cursor-pointer">
                        <!-- JS populated -->
                    </select>
                </div>
            </div>

            <!-- Quick Preset Buttons -->
            <div class="mt-5 pt-3 border-t border-slate-700/50 flex flex-wrap gap-2 items-center justify-between">
                <span class="text-xs text-slate-400 font-medium">빠른 세트 적용:</span>
                <div class="flex flex-wrap gap-1.5" id="preset-buttons">
                    <!-- JS generated presets -->
                </div>
            </div>
        </div>

        <!-- Stats Result Display Box -->
        <div class="terraria-card rounded-2xl p-5 md:p-6 shadow-2xl relative overflow-hidden">
            <!-- Background Glow Decor -->
            <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <h2 class="text-lg font-bold text-slate-200 mb-3 flex items-center justify-between border-b border-slate-700/60 pb-2">
                <span class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    스탯 결과 상세
                </span>
                <span id="set-bonus-badge" class="hidden text-[11px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                    세트 효과 활성
                </span>
            </h2>

            <!-- Breakdown Section -->
            <div class="grid grid-cols-3 gap-2 my-4 text-center">
                <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                    <div class="text-[11px] text-slate-400 mb-1">투구 방어력</div>
                    <div id="helmet-stat" class="text-base md:text-lg font-semibold text-amber-300">[ 투구 : 0 ]</div>
                </div>
                <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                    <div class="text-[11px] text-slate-400 mb-1">갑옷 방어력</div>
                    <div id="chest-stat" class="text-base md:text-lg font-semibold text-cyan-300">[ 갑옷 : 0 ]</div>
                </div>
                <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                    <div class="text-[11px] text-slate-400 mb-1">하의 방어력</div>
                    <div id="legs-stat" class="text-base md:text-lg font-semibold text-emerald-300">[ 하의 : 0 ]</div>
                </div>
            </div>

            <!-- Set Bonus Description -->
            <div id="set-bonus-box" class="hidden my-3 p-2.5 bg-amber-500/10 border border-amber-500/30 rounded-lg text-xs text-amber-200">
                <span class="font-bold">✨ 세트 효과:</span> <span id="set-bonus-text"></span>
            </div>

            <!-- Grand Total Highlight -->
            <div class="mt-4 p-4 rounded-xl bg-gradient-to-r from-amber-500/20 via-orange-500/20 to-red-500/20 border border-amber-500/40 flex items-center justify-between shadow-inner">
                <div>
                    <div class="text-xs uppercase tracking-wider text-amber-300 font-bold">합산 총 방어력</div>
                    <div class="text-xs text-slate-400">Total Defense</div>
                </div>
                <div class="text-right">
                    <span id="total-defense" class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-amber-100 to-white drop-shadow">
                        0
                    </span>
                    <span class="text-sm font-bold text-amber-400 ml-1">DEF</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-xl mx-auto text-center mt-6 text-xs text-slate-500">
        <p>© Terraria Armor Stat Calculator • Vanilla JS Web Application</p>
    </footer>

    <script>
        // Armor Data Database
        const ARMOR_DATA = {
            helmets: [
                { id: 'none', name: '선택 없음', def: 0, class: '-' },
                { id: 'solar', name: '태양 (Solar Flare Helmet)', def: 24, class: '근접' },
                { id: 'vortex', name: '소원성/소용돌이 (Vortex Helmet)', def: 14, class: '원거리' },
                { id: 'nebula', name: '성운 (Nebula Helmet)', def: 14, class: '마법' },
                { id: 'stardust', name: '성운/성좌 (Stardust Helmet)', def: 10, class: '소환' },
                { id: 'hallowed', name: '신성한 마스크 (Hallowed Mask)', def: 24, class: '근접' },
                { id: 'chlorophyte', name: '클로로파이트 마스크', def: 25, class: '근접' },
                { id: 'wood', name: '나무 투구', def: 1, class: '기본' }
            ],
            chests: [
                { id: 'none', name: '선택 없음', def: 0, class: '-' },
                { id: 'solar', name: '태양 (Solar Flare Breastplate)', def: 34, class: '근접' },
                { id: 'vortex', name: '소원성/소용돌이 (Vortex Breastplate)', def: 28, class: '원거리' },
                { id: 'nebula', name: '성운 (Nebula Breastplate)', def: 18, class: '마법' },
                { id: 'stardust', name: '성운/성좌 (Stardust Plate)', def: 16, class: '소환' },
                { id: 'hallowed', name: '신성한 플레이트 (Hallowed Plate)', def: 15, class: '공통' },
                { id: 'chlorophyte', name: '클로로파이트 체스트플레이트', def: 13, class: '공통' },
                { id: 'wood', name: '나무 갑옷', def: 1, class: '기본' }
            ],
            legs: [
                { id: 'none', name: '선택 없음', def: 0, class: '-' },
                { id: 'solar', name: '태양 (Solar Flare Leggings)', def: 20, class: '근접' },
                { id: 'vortex', name: '소원성/소용돌이 (Vortex Leggings)', def: 20, class: '원거리' },
                { id: 'nebula', name: '성운 (Nebula Leggings)', def: 14, class: '마법' },
                { id: 'stardust', name: '성운/성좌 (Stardust Leggings)', def: 12, class: '소환' },
                { id: 'hallowed', name: '신성한 각반 (Hallowed Greaves)', def: 11, class: '공통' },
                { id: 'chlorophyte', name: '클로로파이트 각반', def: 12, class: '공통' },
                { id: 'wood', name: '나무 하의', def: 1, class: '기본' }
            ]
        };

        // Set Bonuses Definition
        const SET_BONUSES = {
            solar: "태양의 방패 보호막이 생성되어 차징 공격이 가능해집니다.",
            vortex: "위장(도둑) 모드를 활성화하여 원거리 대미지 및 크리티컬 확률이 대폭 증가합니다.",
            nebula: "적을 공격할 때 근처 플레이어를 강화하는 버프 부스터가 생성됩니다.",
            stardust: "강력한 스타더스트 수호자가 소환되어 주변 적을 공격합니다.",
            hallowed: "적에게 피해를 주면 잠시 동안 무적 상태가 되는 그림자 회피 능력을 얻습니다.",
            chlorophyte: "머리 위에 녹색 결정체가 소환되어 주변 적에게 자동으로 탄환을 발사합니다.",
            wood: "추가 방어력 +1"
        };

        // DOM Elements
        const helmetSelect = document.getElementById('helmet-select');
        const chestSelect = document.getElementById('chest-select');
        const legsSelect = document.getElementById('legs-select');

        const helmetStat = document.getElementById('helmet-stat');
        const chestStat = document.getElementById('chest-stat');
        const legsStat = document.getElementById('legs-stat');

        const helmetClassTag = document.getElementById('helmet-class-tag');
        const chestClassTag = document.getElementById('chest-class-tag');
        const legsClassTag = document.getElementById('legs-class-tag');

        const totalDefense = document.getElementById('total-defense');
        const setBonusBadge = document.getElementById('set-bonus-badge');
        const setBonusBox = document.getElementById('set-bonus-box');
        const setBonusText = document.getElementById('set-bonus-text');
        const presetButtonsContainer = document.getElementById('preset-buttons');

        // Populate Select Elements
        function initializeSelectOptions() {
            populateOptions(helmetSelect, ARMOR_DATA.helmets);
            populateOptions(chestSelect, ARMOR_DATA.chests);
            populateOptions(legsSelect, ARMOR_DATA.legs);
        }

        function populateOptions(selectElement, items) {
            selectElement.innerHTML = '';
            items.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.textContent = `${item.name} (+${item.def})`;
                opt.className = 'bg-slate-800 text-slate-100';
                selectElement.appendChild(opt);
            });
        }

        // Initialize Quick Preset Buttons
        function initializePresets() {
            const presets = [
                { id: 'solar', label: '태양 세트' },
                { id: 'vortex', label: '소용돌이 세트' },
                { id: 'nebula', label: '성운 세트' },
                { id: 'stardust', label: '성좌 세트' }
            ];

            presets.forEach(preset => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'px-2.5 py-1 text-xs rounded-lg bg-slate-800 hover:bg-amber-500/20 hover:text-amber-300 border border-slate-700 hover:border-amber-500/50 transition-colors text-slate-300 font-medium';
                btn.textContent = preset.label;
                btn.onclick = () => applyPreset(preset.id);
                presetButtonsContainer.appendChild(btn);
            });
        }

        function applyPreset(setId) {
            helmetSelect.value = setId;
            chestSelect.value = setId;
            legsSelect.value = setId;
            calculateStats();
        }

        // Calculate and Update UI Stats
        function calculateStats() {
            const currentHelmet = ARMOR_DATA.helmets.find(i => i.id === helmetSelect.value) || ARMOR_DATA.helmets[0];
            const currentChest = ARMOR_DATA.chests.find(i => i.id === chestSelect.value) || ARMOR_DATA.chests[0];
            const currentLegs = ARMOR_DATA.legs.find(i => i.id === legsSelect.value) || ARMOR_DATA.legs[0];

            // Update Class Tags
            helmetClassTag.textContent = currentHelmet.class;
            chestClassTag.textContent = currentChest.class;
            legsClassTag.textContent = currentLegs.class;

            // Update Breakdown Display Requirement: [ 부위명 : 수치 ]
            helmetStat.textContent = `[ 투구 : ${currentHelmet.def} ]`;
            chestStat.textContent = `[ 갑옷 : ${currentChest.def} ]`;
            legsStat.textContent = `[ 하의 : ${currentLegs.def} ]`;

            // Calculate Total Defense
            let sumDef = currentHelmet.def + currentChest.def + currentLegs.def;

            // Check Set Bonus
            const isFullSet = (currentHelmet.id !== 'none') && 
                              (currentHelmet.id === currentChest.id) && 
                              (currentChest.id === currentLegs.id);

            if (isFullSet && SET_BONUSES[currentHelmet.id]) {
                setBonusBadge.classList.remove('hidden');
                setBonusBox.classList.remove('hidden');
                setBonusText.textContent = SET_BONUSES[currentHelmet.id];
                
                // Wooden Set Bonus adds +1 def
                if (currentHelmet.id === 'wood') {
                    sumDef += 1;
                }
            } else {
                setBonusBadge.classList.add('hidden');
                setBonusBox.classList.add('hidden');
            }

            // Animate Defense Number Counter Effect
            animateNumber('total-defense', parseInt(totalDefense.textContent) || 0, sumDef, 250);
        }

        // Smooth Counter Animation Function
        function animateNumber(elementId, start, end, duration) {
            const obj = document.getElementById(elementId);
            if (start === end) {
                obj.textContent = end;
                return;
            }

            const range = end - start;
            let current = start;
            const increment = end > start ? 1 : -1;
            const stepTime = Math.abs(Math.floor(duration / (range === 0 ? 1 : range)));
            
            const timer = setInterval(() => {
                current += increment;
                obj.textContent = current;
                if (current === end) {
                    clearInterval(timer);
                }
            }, Math.max(stepTime, 15));
        }

        // Initialize Event Listeners & Initial State
        window.onload = function() {
            initializeSelectOptions();
            initializePresets();

            helmetSelect.addEventListener('change', calculateStats);
            chestSelect.addEventListener('change', calculateStats);
            legsSelect.addEventListener('change', calculateStats);

            // Initial calculation
            calculateStats();
        };
    </script>
</body>
</html>
